<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>げんばログ</title>
<script src="webxdc.js"></script>
<style>
:root{--bg:#E9ECEF;--card:#fff;--ink:#16202A;--mute:#5C6773;--line:#D3D9DF;--y:#FFC21A;--board:#1F4D3A;--wood:#D9BE8A;--chalk:#F4F6EF;--red:#C93A26;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#10161C;--card:#1A232D;--ink:#EEF2F5;--mute:#9AA6B2;--line:#2B3744;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2F7DD1;outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:13px;background:var(--y);display:grid;place-items:center}
h1{margin:0;font-size:22px;font-weight:800;line-height:1.1;letter-spacing:.03em}
.sub{font-size:13px;color:var(--mute)}
.cnt{margin-left:4px;text-align:right;font-size:13px;color:var(--mute);line-height:1.2}
.cnt b{display:block;font-size:24px;color:var(--ink)}
main{max-width:560px;margin:0 auto;padding:14px 14px 130px}
.edit{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#FFE9A6;color:#16202A;border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:12px;font-weight:700}
.edit button{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid #16202A;background:transparent;font-weight:800}
.board{background:var(--board);color:var(--chalk);border:8px solid var(--wood);border-radius:22px;padding:16px;display:grid;gap:16px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.row{display:grid;grid-template-columns:1fr;gap:6px}
.row>b{font-size:15px;opacity:.9}
.chalk{border:2px solid rgba(244,246,239,.55);background:transparent;color:var(--chalk);border-radius:14px}
#date{width:100%;height:56px;padding:0 12px;font-size:20px;font-weight:700;color-scheme:dark}
.wx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wx button{height:68px;font-size:27px;line-height:1;display:grid;place-items:center;padding:6px 0 4px}
.wx small{font-size:12px;font-weight:700}
.wx button[aria-pressed=true]{background:var(--y);border-color:var(--y);color:#16202A}
.step{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:center}
.step button{height:56px;font-size:30px;font-weight:700;cursor:pointer}
.n{display:flex;align-items:baseline;justify-content:center;gap:4px;font-weight:800}
.n input{width:5ch;text-align:center;font-size:34px;font-weight:800;background:transparent;border:0;color:var(--chalk);padding:0;-moz-appearance:textfield}
.n input::-webkit-inner-spin-button{-webkit-appearance:none}
.lab{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px;font-weight:800}
.lab span{font-weight:500;font-size:13px;color:var(--mute)}
textarea{width:100%;min-height:132px;border:2px solid var(--line);border-radius:16px;background:var(--card);padding:14px;font-size:18px;line-height:1.6;resize:vertical}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{aspect-ratio:1;border-radius:14px;border:2px dashed var(--line);background:var(--card);position:relative;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .x{position:absolute;top:5px;right:5px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(22,32,42,.82);color:#fff;font-size:22px;cursor:pointer}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn{min-height:56px;border-radius:16px;border:2px solid var(--ink);background:var(--card);font-weight:800;padding:0 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.main{background:var(--y);border-color:var(--y);color:#16202A;font-size:20px;min-height:66px;width:100%;margin-top:24px}
.btn:disabled{opacity:.4}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
nav button{height:60px;border:0;border-radius:16px;background:transparent;font-weight:800;font-size:14px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button[aria-selected=true]{background:var(--ink);color:var(--bg)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border-radius:18px;border:1px solid var(--line);border-left:7px solid var(--y);padding:14px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:10px}
.dt{font-size:28px;font-weight:800;line-height:1}
.dt small{font-size:14px;font-weight:700;color:var(--mute);margin-left:4px}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{background:var(--bg);border-radius:999px;padding:3px 12px;font-weight:800}
.wxe{font-size:28px;line-height:1}
.body{margin:10px 0;white-space:pre-wrap;word-break:break-word}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.ph>*{aspect-ratio:1;width:100%;border-radius:12px;overflow:hidden;border:0;padding:0;background:var(--bg);display:grid;place-items:center;font-size:13px;color:var(--mute)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;flex-wrap:wrap}
.tag{background:#FFE9A6;color:#16202A;border-radius:8px;padding:0 8px;font-weight:700;font-size:12px}
.acts{margin-left:auto;display:flex;gap:8px}
.mini{min-height:48px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:transparent;font-weight:800;cursor:pointer}
.mini.arm{background:var(--red);border-color:var(--red);color:#fff}
.empty{text-align:center;padding:48px 16px;color:var(--mute)}
.empty b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}
#v{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.93);display:grid;place-items:center}
#v img{max-width:100%;max-height:100%}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:60;max-width:90%;text-align:center}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;display:grid;gap:10px}
.sec h2{margin:0;font-size:19px}
.hint{margin:0;font-size:14px;color:var(--mute)}
.per{display:flex;gap:10px;align-items:center}
#mon{flex:1;min-width:0;height:56px;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:0 12px;font-size:19px;font-weight:700}
.all{display:flex;align-items:center;gap:8px;font-weight:700;min-height:56px;white-space:nowrap}
.all input{width:28px;height:28px;accent-color:#16202A}
.sum{font-weight:800;font-size:18px}
.btn.y{background:var(--y);border-color:var(--y);color:#16202A}
#impbox{background:#FFE9A6;color:#16202A;border-radius:14px;padding:14px;display:grid;gap:10px}
#impbox p{margin:0;font-weight:700}
#impbox .btn{border-color:#16202A;color:#16202A;background:#fff}
#impbox .btn.y{background:var(--y)}
.chalk[aria-pressed=true]{background:var(--y);border-color:var(--y);color:#16202A}
.chalk{cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts .chalk{min-height:52px;padding:0 14px;font-weight:700;font-size:16px}
.tg{min-height:56px;width:100%;font-weight:800;font-size:18px}
.tx{width:100%;height:56px;padding:0 12px;font-size:19px;font-weight:700}
.xs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.xs .chip{font-size:14px}
.fl{display:grid;gap:4px;font-weight:700}
.fl input,.ef input,.ef select{height:52px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;font-size:17px;min-width:0;width:100%}
.ef{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border:1px solid var(--line);border-radius:14px}
.ef input[data-p=o]{grid-column:1/-1}
.chip.ng{background:var(--red);color:#fff}
.btn[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.lst{display:grid;gap:8px}
.lst .tg{justify-content:flex-start;text-align:left;padding:0 14px}
.tm{display:grid;grid-template-columns:1fr 76px;gap:8px}
.tm button{height:56px;font-weight:800;font-size:17px}
.tx{color-scheme:dark}
#gf{height:52px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:0 12px;font-size:17px;width:100%}
#gr svg{width:100%;height:auto;display:block}
#lang{margin-left:auto;max-width:112px;height:40px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:0 6px;font-size:13px;font-weight:700}
[dir=rtl] #lang{margin-left:0;margin-right:auto}
[dir=rtl] .cnt{margin-left:0;margin-right:4px;text-align:left}
[dir=rtl] .card{border-left:1px solid var(--line);border-right:7px solid var(--y)}
[dir=rtl] .slot .x{right:auto;left:5px}
[dir=rtl] .chips,[dir=rtl] .acts{margin-left:0;margin-right:auto}
[dir=rtl] .lst .tg{text-align:right}
[dir=rtl] .dt small{margin-left:0;margin-right:4px}
/* Allow translated labels and native date/month controls to fit narrow screens. */
.board{grid-template-columns:minmax(0,1fr)}
.row,.sec>*,.board>*{min-width:0}
.row>b,.sub,.btn,.tg{overflow-wrap:anywhere}
.wx{grid-template-columns:repeat(4,minmax(0,1fr))}
.wx small{overflow-wrap:anywhere;text-align:center}
.step{grid-template-columns:48px minmax(0,1fr) 48px}
.n{min-width:0;gap:2px}.n input{min-width:0;width:4ch;max-width:100%;font-size:30px}
.n span{font-size:14px}
.pick{grid-template-columns:repeat(2,minmax(0,1fr))}
.btn{min-width:0;padding:8px 12px;text-align:center}
.per{flex-wrap:wrap}.per #mon{flex:1 1 140px}.per .all{white-space:normal}
nav button{min-width:0;overflow-wrap:anywhere;font-size:clamp(11px,3.3vw,14px)}
@media(max-width:380px){
 header{display:grid;grid-template-columns:36px minmax(0,1fr) 94px;column-gap:8px;row-gap:0;padding-left:12px;padding-right:12px}
 header .logo{width:36px;height:36px;grid-row:1/3}
 header>div:nth-child(2){grid-column:2;grid-row:1;min-width:0}
 header h1{font-size:20px}header .sub{font-size:11px}
 #lang{grid-column:3;grid-row:1/3;width:94px;max-width:94px;margin:0!important}
 header .cnt{grid-column:2;grid-row:2;display:flex;gap:6px;align-items:baseline;text-align:start;margin:0;font-size:11px}
 header .cnt b{font-size:15px}
}
.fl select{height:52px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;min-width:0;width:100%}
.word-preview{background:var(--bg);padding:12px;border-radius:12px;overflow-wrap:anywhere}
.word-preview p{margin:4px 0 0}.word-fields{display:grid;gap:12px;margin-top:12px}
#word-custom summary{cursor:pointer;font-weight:700;min-height:44px;padding:8px 0;overflow-wrap:anywhere}
.acts{flex-wrap:wrap;max-width:100%}.mini{min-width:0;max-width:100%;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <div class="logo"><svg width="26" height="26" viewBox="0 0 26 26" fill="none"><rect x="2" y="3" width="22" height="18" rx="4" fill="#1F4D3A" stroke="#16202A" stroke-width="2"/><path d="M7 9.5l2 2 3-3.5M15 10h4M7 16h12" stroke="#F4F6EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div><h1>げんばログ</h1><div class="sub" id="sub"></div></div>
  <select id="lang" aria-label="言語"></select>
  <div class="cnt"><span data-i="記録">記録</span><b id="cnt">0</b></div>
</header>
<main>
  <section id="vw">
    <div class="edit" id="eb" hidden><span data-i="訂正中：上書き保存します">訂正中：上書き保存します</span><button id="cancel" data-i="やめる">やめる</button></div>
    <div class="board" id="board"></div>
    <div class="lab"><b id="tl">作業内容</b><span id="tc">0/500</span></div>
    <textarea id="tx" maxlength="500"></textarea>
    <div class="lab"><b data-i="写真">写真</b><span id="pc">0/3</span></div>
    <div class="slots" id="slots"></div>
    <div class="pick">
      <label class="btn">📷 <span data-i="撮影">撮影</span><input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="btn">🖼 <span data-i="選ぶ">選ぶ</span><input id="fil" type="file" accept="image/*" multiple hidden></label>
    </div>
    <button class="btn main" id="post" data-i="投稿する">投稿する</button>
  </section>
  <section id="vl" hidden>
    <div id="flt" hidden style="margin-bottom:12px"><button class="btn" id="fng" aria-pressed="false" style="width:100%"></button></div>
    <div id="list"></div>
    <div class="empty" id="empty"><b data-i="まだ日誌がありません">まだ日誌がありません</b><br><button class="btn" id="first" data-i="日誌を書く" style="margin:0 auto">日誌を書く</button></div>
  </section>
  <section id="vd" hidden>
    <div class="sec"><h2 data-i="書き出し">書き出し</h2>
      <p class="hint" data-i="期間を選んで、チャットにファイルを送ります。">期間を選んで、チャットにファイルを送ります。</p>
      <div class="per"><input id="mon" type="month" aria-label="月"><label class="all"><input id="all" type="checkbox"><span data-i="全期間">全期間</span></label></div>
      <div class="sum" id="sum"></div>
      <button class="btn ex" id="xc" data-i="表（CSV）を送る">📄 表（CSV）を送る</button>
      <button class="btn ex" id="xh" data-i="写真つきまとめ（HTML）を送る">🧾 写真つきまとめ（HTML）を送る</button>
      <button class="btn ex" id="xj" data-i="引き継ぎデータ（JSON）を送る">📦 引き継ぎデータ（JSON）を送る</button>
    </div>
    <div class="sec" id="gsec"><h2 data-i="推移グラフ">推移グラフ</h2>
      <p class="hint" data-i="上で選んだ期間の、数値の変化を表示します。">上で選んだ期間の、数値の変化を表示します。</p>
      <select id="gf" aria-label="グラフにする項目"></select>
      <div id="gr"></div><div class="hint" id="gs"></div>
    </div>
    <div class="sec"><h2 data-i="取り込み">取り込み</h2>
      <p class="hint" data-i="別の現場で書き出した引き継ぎデータ（JSON）を、この現場に追加します。">別の現場で書き出した引き継ぎデータ（JSON）を、この現場に追加します。</p>
      <button class="btn" id="impbtn" data-i="ファイルを選ぶ">📥 ファイルを選ぶ</button>
      <input id="impfile" type="file" accept=".json,application/json" hidden>
      <div id="impbox" hidden><p id="impinfo"></p><label class="all" id="impl" hidden><input id="imptpl" type="checkbox" checked><span></span></label><div class="pick"><button class="btn y" id="impgo" data-i="取り込む">取り込む</button><button class="btn" id="impno" data-i="やめる">やめる</button></div></div>
    </div>
  </section>
  <section id="vs" hidden>
    <div class="sec" id="wording-settings">
      <h2 data-i="表現の設定">表現の設定</h2>
      <p class="hint" data-i="この端末の表示だけを変えます。記録やほかの人の設定は変わりません。"></p>
      <label class="fl"><span data-i="年代・読みやすさ"></span><select id="word-age"></select></label>
      <label class="fl"><span data-i="仕事・用途"></span><select id="word-role"></select></label>
      <div class="word-preview"><b data-i="表示例"></b><p id="word-preview" aria-live="polite"></p></div>
      <details id="word-custom"><summary data-i="表現を自分で調整"></summary>
        <p class="hint" data-i="空欄なら選んだ表現を使います。"></p>
        <div class="word-fields">
          <label class="fl"><span data-i="記録を残すボタン"></span><input id="word-post" maxlength="32" dir="auto"></label>
          <label class="fl"><span data-i="編集ボタン"></span><input id="word-edit" maxlength="32" dir="auto"></label>
          <label class="fl"><span data-i="削除ボタン"></span><input id="word-delete" maxlength="32" dir="auto"></label>
          <label class="fl"><span data-i="本文の見出し"></span><input id="word-heading" maxlength="32" dir="auto"></label>
        </div>
      </details>
      <button class="btn" id="word-reset" data-i="表現を初期設定に戻す"></button>
    </div>
    <div class="sec"><h2 data-i="日誌の形式">日誌の形式</h2>
      <p class="hint" data-i="この現場（チャット）で使う入力項目を選びます。変更すると全員の画面に反映されます。">この現場（チャット）で使う入力項目を選びます。変更すると全員の画面に反映されます。</p>
      <div class="sum" id="cur"></div>
      <div class="opts" id="presets"></div>
    </div>
    <div class="sec"><h2 data-i="項目を編集">項目を編集</h2>
      <label class="fl"><span data-i="形式の名前">形式の名前</span><input id="e-name" maxlength="16"></label>
      <label class="all"><input id="e-wx" type="checkbox"><span data-i="天気を入力する">天気を入力する</span></label>
      <label class="fl"><span data-i="本文の見出し">本文の見出し</span><input id="e-tl" maxlength="16"></label>
      <div id="e-fields" style="display:grid;gap:10px"></div>
      <button class="btn" id="e-add" data-i="＋ 項目を追加（最大6）">＋ 項目を追加（最大6）</button>
      <button class="btn y" id="e-save" style="min-height:62px;font-size:18px" data-i="全員に反映する">全員に反映する</button>
    </div>
  </section>
</main>
<nav>
  <button id="t1" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><span data-i="書く">書く</span></button>
  <button id="t2" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg><span data-i="一覧">一覧</span></button>
  <button id="t3" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-i="データ">データ</span></button>
  <button id="t4" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6"/></svg><span data-i="設定">設定</span></button>
</nav>
<div id="v" hidden><img alt="拡大写真"></div>

const WORD_AGES={adult:'一般向け',child:'小学生向け',teen:'中高生向け',senior:'シニア向け'};
const WORD_ROLES={auto:['形式に合わせる',''],site:['現場日誌','作業内容'],farm:['農業日誌','作業内容・様子'],pet:['飼育日誌','様子・メモ'],patrol:['点検巡回','所見・指摘事項'],watch:['観察記録','観察メモ'],diary:['日記・学校生活','今日のできごと']};
const BODY_KEYS=['作業内容','作業内容・様子','様子・メモ','所見・指摘事項','観察メモ','今日のできごと'];
function defaultWording(){return {age:'adult',role:'auto',custom:{}}}
function readWording(){try{const p=JSON.parse(localStorage.getItem('genba-wording-v1')||'null'),w=defaultWording();if(!p||typeof p!=='object')return w;if(Object.prototype.hasOwnProperty.call(WORD_AGES,p.age))w.age=p.age;if(Object.prototype.hasOwnProperty.call(WORD_ROLES,p.role))w.role=p.role;for(const k of ['post','edit','delete','heading'])if(typeof p.custom?.[k]==='string')w.custom[k]=p.custom[k].trim().slice(0,32);return w}catch(e){return defaultWording()}}
let wording=readWording();
const AGE_WORDS={
 child:{'書く':'かく','一覧':'おもいで','投稿する':'日記をのこす','編集':'かきなおす','削除':'けす','やめる':'やめる','訂正を保存する':'かきなおして のこす','もう一度押して削除':'もういちど おすと けせます','投稿しました':'のこしました','訂正を保存しました':'かきなおしました','削除しました':'けしました','日誌を書く':'日記をかく'},

 senior:{'投稿する':'記録を保存する','編集':'内容を直す','削除':'記録を消す','訂正を保存する':'内容を保存する','一覧':'記録一覧','データ':'保存・取り込み','設定':'使い方の設定'}
};
function tr(s){
 let key=s;
 if(wording.role!=='auto'){
   const role=WORD_ROLES[wording.role];
   if(BODY_KEYS.includes(s))key=role[1];
   if(s==='投稿する')key=wording.role==='diary'?'保存する':'記録を追加する';
 }
 if(s==='投稿する'&&tpl?.name==='日記')key='保存する';
 if(AGE_WORDS[wording.age]?.[s])key=AGE_WORDS[wording.age][s];
 if(wording.age==='child'&&s==='設定'&&LANG==='ja')return 'せってい';
 const customKey=({'投稿する':'post','編集':'edit','削除':'delete'})[s]||(BODY_KEYS.includes(s)?'heading':null);
 if(customKey&&wording.custom[customKey])return wording.custom[customKey];
 return baseTr(key);
}
function saveWording(){try{localStorage.setItem('genba-wording-v1',JSON.stringify(wording))}catch(e){}}
function renderWording(){
 $('#word-age').innerHTML=Object.entries(WORD_AGES).map(([id,key])=>'<option value="'+id+'"'+(wording.age===id?' selected':'')+'>'+esc(baseTr(key))+'</option>').join('');
 $('#word-role').innerHTML=Object.entries(WORD_ROLES).map(([id,pair])=>'<option value="'+id+'"'+(wording.role===id?' selected':'')+'>'+esc(baseTr(pair[0]))+'</option>').join('');
 for(const [id,key]of Object.entries({post:'投稿する',edit:'編集',delete:'削除',heading:tpl.tl})){const input=$('#word-'+id);input.value=wording.custom[id]||'';input.placeholder=tr(key)}
 $('#word-preview').textContent=tr(tpl.tl)+' / '+tr('投稿する')+' / '+tr('編集')+' / '+tr('削除');
 $('#tx').placeholder=baseTr(wording.age==='child'?'できごとや、気づいたことを書いてみよう。':'作業や気づいたことを記入してください。');
 $('#tx').setAttribute('aria-label',tr(tpl.tl));
}
$('#word-age').onchange=e=>{wording.age=e.target.value;saveWording();applyLang()};
$('#word-role').onchange=e=>{wording.role=e.target.value;saveWording();applyLang()};
for(const id of ['post','edit','delete','heading'])$('#word-'+id).onchange=e=>{wording.custom[id]=e.target.value.trim().slice(0,32);saveWording();applyLang()};
$('#word-reset').onclick=()=>{wording=defaultWording();saveWording();applyLang()};
function detect(){
  let s='';try{s=localStorage.getItem('genba-lang')||''}catch(e){}
  if(LC[s])return s;
  const n=(navigator.language||'ja').toLowerCase();
  if(n.startsWith('fil'))return 'fil';if(n.startsWith('tl'))return 'tl';
  const b=n.slice(0,2);return LC[b]?b:'ja';
}

const n1=v=>String(Math.round(v*10)/10);
function drawGraph(){

  const f=nf.find(x=>x.k===sel.value),tf=tpl.fields.find(x=>x.t==='time'),ls=pickLogs(),cnt={},run={},pts=[];

  ls.forEach(l=>{

  const ta=pts[0].t,tb=pts[pts.length-1].t,sx=t=>ml+(tb===ta?.5:(t-ta)/(tb-ta))*(WW-ml-mr),sy=v=>mt+(1-(v-lo)/(hi-lo))*(HH-mt-mb);
  let g='';

  g+='<polyline fill="none" style="stroke:var(--y)" stroke-width="3" stroke-linejoin="round" points="'+pts.map(p=>sx(p.t).toFixed(1)+','+sy(p.v).toFixed(1)).join(' ')+'"/>';
  g+=pts.map(p=>'<circle cx="'+sx(p.t).toFixed(1)+'" cy="'+sy(p.v).toFixed(1)+'" r="4" style="fill:var(--card);stroke:var(--ink)" stroke-width="2"/>').join('');
  g+='<text x="'+ml+'" y="'+(HH-8)+'" style="fill:var(--mute)" font-size="11">'+fmt(pts[0].date)[0]+'</text><text x="'+(WW-mr)+'" y="'+(HH-8)+'" text-anchor="end" style="fill:var(--mute)" font-size="11">'+fmt(pts[pts.length-1].date)[0]+'</text>';

}

function cellOf(f,v){
  if(v===undefined)return '';if(f.t==='chk')return v===true?'○':'';
  if(f.t==='lst'&&typeof v==='string'){const n=f.o.length,k=v.slice(0,n).split('1').length-1,un=f.o.filter((_,i)=>v[i]!=='1');return k+'/'+n+(un.length?' '+tr('未確認：')+un.map(tr).join('・'):'')}
  return typeof v==='string'&&f.t==='sel'?tr(v):v;
}
const cs=v=>{v=String(v);if(/^[\s]*[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
function csv(a){
  const hd=[tr('日付'),tr('曜日')];if(tpl.wx)hd.push(tr('天気'));
  tpl.fields.forEach(f=>hd.push(tr(f.l)+(f.t==='num'&&f.u?'（'+tr(f.u)+'）':'')));
  hd.push(tr(tpl.tl),tr('投稿者'),tr('写真枚数'),tr('訂正回数'));
  const r=[hd];
  a.forEach(l=>{const row=[l.date,fmt(l.date)[1]];if(tpl.wx)row.push(l.weather?tr(WX[l.weather][1]):'');
    tpl.fields.forEach(f=>{const v=l.x[f.k];row.push(cellOf(f,v))});
    row.push(l.text,l.author,photosOf(l).length,l.rev-1);r.push(row)});
  return '\uFEFF'+r.map(x=>x.map(cs).join(',')).join('\r\n');
}
function html(a){
  const t=tr(tpl.name)+' '+label();
  const items=a.map(l=>{const[d,wd]=fmt(l.date),p=photosOf(l),w=l.weather&&WX[l.weather],parts=[];if(w)parts.push({s:w[0]+' '+tr(w[1])});xs(l).forEach(o=>parts.push(o));parts.push({s:l.author});
    return '<article><div class="h">'+l.date+' ('+wd+')<span>'+parts.map(o=>o.ng?'<b class="ng">'+esc(o.s)+'</b>':esc(o.s)).join('／')+'</span></div><p>'+esc(l.text)+'</p>'+(p.length?'<div class="g">'+p.map(s=>'<img src="'+s+'" alt="">').join('')+'</div>':'')+'</article>'}).join('');
  return '<!DOCTYPE html><html lang="'+esc(LC[LANG])+'" dir="'+(LANG==='ar'?'rtl':'ltr')+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(t)+'</title><style>body{font:15px/1.6 system-ui,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;max-width:800px;margin:0 auto;padding:20px;color:#16202A}h1{font-size:22px;border-bottom:4px solid #FFC21A;padding-bottom:8px}article{break-inside:avoid;border:1px solid #ccd3da;border-left:6px solid #FFC21A;border-radius:10px;padding:12px 14px;margin:14px 0}.h{font-weight:800;font-size:18px}.h span{font-weight:500;font-size:14px;color:#556;margin-left:10px}p{white-space:pre-wrap;margin:8px 0}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.g img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}small{color:#667}.ng{color:#C93A26}@media print{body{padding:0}}</style></head><body><h1>'+esc(t)+'</h1><small>'+tr('記録')+': '+a.length+' / '+tr('書き出し')+' — げんばログ</small>'+items+'</body></html>';
}
const jsonOut=a=>JSON.stringify({app:'genba-log',v:2,exported:Date.now(),tpl:{name:tpl.name,wx:tpl.wx,tl:tpl.tl,fields:tpl.fields},logs:a.map(l=>{const p=photosOf(l);return{...l,n:p.length,photos:p}})});
function b64(s){const u=new TextEncoder().encode(s);let b='';for(let i=0;i<u.length;i+=32768)b+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(b)}
async function sendFile(name,mime,str,text){
  if(str.length>15e6){toast('ファイルが大きすぎます。期間を短くしてください');return}
  if(W.sendToChat){
    try{await W.sendToChat({file:{name,base64:b64(str)},text})}
    catch(e){if(!/cancel/i.test(String(e&&e.message||e)))toast('送信できません。もう一度押してください')}
    return;
  }
  if(!W.mock){toast('お使いのDeltaChatは書き出しに未対応です');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([str],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('書き出し');
}
function exp(k){
  const a=pickLogs();if(!a.length)return;if(a.some(l=>photosOf(l).length<l.n)){toast('写真を受信中です。少し待ってください');return}
  const n=$('#all').checked?'all':ym(),tx=tr(tpl.name)+' '+label()+' ('+a.length+')';
  if(k==='c')sendFile('genba-'+n+'.csv','text/csv',csv(a),tx);
  else if(k==='h')sendFile('genba-'+n+'.html','text/html',html(a),tx);
  else sendFile('genba-'+n+'.json','application/json',jsonOut(a),tx+' (JSON)');
}
$('#xc').onclick=()=>exp('c');$('#xh').onclick=()=>exp('h');$('#xj').onclick=()=>exp('j');

let imp=null,impTpl=null;
const readText=f=>new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=ng;r.readAsText(f)});
async function readImport(f){
  imp=null;impTpl=null;$('#impbox').hidden=true;
  try{
    if(f.size>20e6)throw Error('file too large');const j=JSON.parse(await readText(f));
    if(j.app!=='genba-log'||!Array.isArray(j.logs))throw 0;
    const ok=[],seen=new Set();let pc=0;
    for(const l of j.logs){
      if(!l||typeof l!=='object'||!okLog(l)||!Array.isArray(l.photos))continue;
      const c=logs.get(l.id);
      if((c&&(c.addr!==l.addr||c.rev>=l.rev))||isDead(l)||seen.has(l.id))continue;seen.add(l.id);
      const p=l.photos.slice(0,3).filter(s=>okPhoto({logId:l.id,pr:l.pr,idx:0,data:s})&&s.length<=MAX-1500);
      if(p.length!==l.n)throw Error('incomplete photos');ok.push({...l,n:p.length,photos:p});pc+=p.length;
    }
    impTpl=null;
    if(j.tpl&&typeof j.tpl==='object'){const t={name:j.tpl.name,wx:j.tpl.wx,tl:j.tpl.tl,fields:j.tpl.fields};if(okTpl({...t,v:1,ts:1}))impTpl=t}
    if(!ok.length&&!impTpl){toast('取り込める新しい記録がありません');return}
    imp=ok;$('#impinfo').textContent=tr('取り込み')+' / '+counts(ok.length,pc);
    $('#impl').hidden=!impTpl;$('#impl span').textContent=tr('形式も取り込む')+': '+(impTpl?tr(impTpl.name):'');$('#impbox').hidden=false;
  }catch(e){toast('取り込めません。げんばログの引き継ぎデータを選んでください')}
}
$('#impbtn').onclick=async()=>{
  if(W.importFiles){try{const fs=await W.importFiles({extensions:['.json'],mimeTypes:['application/json'],multiple:false});if(fs&&fs[0])readImport(fs[0])}catch(e){}}
  else $('#impfile').click();
};
$('#impfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)readImport(f)};
$('#impno').onclick=()=>{imp=null;impTpl=null;$('#impbox').hidden=true};
$('#impgo').onclick=async()=>{
  if(!imp||busy)return;lock(true);
  try{
    if(impTpl&&$('#imptpl').checked)await publishTpl(impTpl);
    for(const [i,l] of imp.entries()){
      const{photos,...p}=l,u={payload:{...p,type:'log'}};
      if(!i)u.info=tr('取り込み')+': '+imp.length;
      await send(u);
      for(const [idx,data] of photos.entries())await send({payload:{type:'photo',logId:l.id,pr:l.pr,idx,data}});
    }
    toast('取り込み');imp=null;impTpl=null;$('#impbox').hidden=true;go('l');
  }catch(e){toast('送信できません。もう一度押してください')}finally{lock(false)}
};

/* 形式の設定 */
let ed=clone(PRE.site),edDirty=false;
function publishTpl(t){
  return send({payload:{type:'tpl',v:tpl.v+1,ts:Date.now(),name:t.name,wx:t.wx,tl:t.tl,fields:t.fields},info:tr('日誌の形式')+': '+tr(t.name)});
}
function renderCur(){$('#cur').textContent=tr('使用中')+': '+baseTr(tpl.name)+(tpl.v?' ('+tpl.v+')':' ('+tr('初期設定')+')')}
function loadEd(t){ed=clone({name:t.name,wx:t.wx,tl:t.tl,fields:t.fields});renderEd()}
function renderEd(){
  $('#e-name').value=baseTr(ed.name);$('#e-wx').checked=ed.wx;$('#e-tl').value=baseTr(ed.tl);
  $('#e-fields').innerHTML=ed.fields.map((f,i)=>'<div class="ef" data-row="'+i+'"><input data-p="l" maxlength="12" placeholder="項目名" aria-label="項目名" value="'+esc(baseTr(f.l))+'"><select data-p="t" aria-label="種類">'+[['num','数値'],['sel','選択'],['lst','チェックリスト'],['chk','チェック'],['time','時刻'],['txt','短い文']].map(([v,n])=>'<option value="'+v+'"'+(f.t===v?' selected':'')+'>'+tr(n)+'</option>').join('')+'</select>'+(f.t==='num'?'<input data-p="u" maxlength="4" placeholder="単位（kgなど）" aria-label="単位" value="'+esc(f.u||'')+'">':'')+(f.t==='sel'||f.t==='lst'?'<input data-p="o" placeholder="'+tr(f.t==='lst'?'点検項目を「、」で区切る':'選択肢を「、」で区切る')+'" aria-label="選択肢" value="'+esc((f.o||[]).map(baseTr).join(', '))+'">':'')+'<button class="mini" data-del="1" aria-label="この項目を削除">'+esc(tr('削除'))+'</button></div>').join('');
  localize($('#e-fields'));$('#e-add').disabled=ed.fields.length>=6;
}
$('#presets').innerHTML=Object.entries(PRE).map(([k,v])=>'<button class="btn" data-p="'+k+'">'+esc(baseTr(v.name))+'</button>').join('');
$('#presets').addEventListener('click',e=>{const b=e.target.closest('button');if(b){ed=clone(PRE[b.dataset.p]);edDirty=true;renderEd();toast('下の内容を確認して「全員に反映する」を押してください')}});
$('#e-name').oninput=e=>{ed.name=e.target.value;edDirty=true};$('#e-tl').oninput=e=>{ed.tl=e.target.value;edDirty=true};$('#e-wx').onchange=e=>{ed.wx=e.target.checked;edDirty=true};
$('#e-fields').addEventListener('input',e=>{
  const row=e.target.closest('.ef'),p=e.target.dataset.p;if(!row||!p||p==='t')return;
  const f=ed.fields[+row.dataset.row];edDirty=true;
  if(p==='o')f.o=e.target.value.split(/[、,，]/).map(s=>s.trim()).filter(Boolean).slice(0,8);else f[p]=e.target.value;
});
$('#e-fields').addEventListener('change',e=>{const row=e.target.closest('.ef');if(row&&e.target.dataset.p==='t'){const f=ed.fields[+row.dataset.row];f.t=e.target.value;if((f.t==='sel'||f.t==='lst')&&!f.o)f.o=[];edDirty=true;renderEd()}});
$('#e-fields').addEventListener('click',e=>{const b=e.target.closest('button[data-del]');if(b){ed.fields.splice(+b.closest('.ef').dataset.row,1);edDirty=true;renderEd()}});
$('#e-add').onclick=()=>{if(ed.fields.length<6){ed.fields.push({k:'f'+Math.random().toString(36).slice(2,6),l:'',t:'num'});edDirty=true;renderEd()}};
$('#e-save').onclick=async()=>{
  if(busy)return;
  const t={name:ed.name.trim(),wx:ed.wx,tl:ed.tl.trim(),fields:ed.fields.map(f=>{const o={k:f.k,l:(f.l||'').trim(),t:f.t};if(f.t==='num'&&f.u&&f.u.trim())o.u=f.u.trim();if(f.t==='sel'||f.t==='lst')o.o=(f.o||[]).filter(Boolean);if(f.d!==undefined)o.d=f.d;return o})};
  if(!okTpl({...t,v:1,ts:1})){toast('名前と項目名を入れてください（選択項目は選択肢も必要です）');return}
  lock(true);try{await publishTpl(t);edDirty=false;toast('全員に反映する')}catch(e){toast('送信できません。もう一度押してください')}finally{lock(false)}
};

function localize(root){
  root.querySelectorAll('[data-i]').forEach(e=>{if(IDX.has(e.dataset.i)||EXTRA.ja[e.dataset.i])e.textContent=tr(e.dataset.i)});
  root.querySelectorAll('[aria-label],[placeholder],img[alt]').forEach(e=>{for(const a of ['aria-label','placeholder','alt']){if(!e.hasAttribute(a))continue;const key='i18n'+a.replace('-','');if(!e.dataset[key])e.dataset[key]=e.getAttribute(a);e.setAttribute(a,tr(e.dataset[key]))}});

}
function applyLang(){
  document.documentElement.lang=LC[LANG];document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  localize(document.body);
  $('#sub').textContent=tr(tpl.name);$('#tl').textContent=tr(tpl.tl);
  renderWording();$('#post').textContent=tr(draft.id?'訂正を保存する':'投稿する');renderBoard();renderList();slots();renderCur();renderEd();sumUpdate();$('#presets').innerHTML=Object.entries(PRE).map(([k,v])=>'<button class="btn" data-p="'+k+'">'+esc(baseTr(v.name))+'</button>').join('');
}
$('#lang').onchange=e=>{LANG=e.target.value;try{localStorage.setItem('genba-lang',LANG)}catch(x){}applyLang()};
LANG=detect();$('#lang').innerHTML=LN.map(([c,n])=>'<option value="'+c+'"'+(c===LANG?' selected':'')+'>'+n+'</option>').join('');
syncForm();renderCur();applyLang();
W.setUpdateListener(u=>{try{apply(u.payload)}catch(e){console.warn('Invalid update ignored',e)}},0).catch(()=>toast('受信を開始できません。開き直してください'));
</script>
